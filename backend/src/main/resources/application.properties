# Server Port
server.port=8080
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Database Configuration (allowPublicKeyRetrieval=true resolves the connection error)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/devpulse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate 6 auto-detects MySQLDialect; keep it commented out to prevent warning HHH90000025
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration Properties (REQUIRED)
devpulse.app.jwtSecret=${JWT_SECRET}
devpulse.app.jwtExpirationMs=86400000
